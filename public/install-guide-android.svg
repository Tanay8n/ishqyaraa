<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e1b22" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid & Decor -->
  <circle cx="530" cy="50" r="100" fill="#9e1b22" fill-opacity="0.12" />
  <circle cx="70" cy="290" r="90" fill="#f59e0b" fill-opacity="0.08" />

  <!-- STEP 1: Chrome Top Bar & 3-Dots -->
  <g transform="translate(30, 30)">
    <rect width="250" height="120" rx="16" fill="#292524" stroke="#44403c" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Chrome Address Bar -->
    <rect x="14" y="16" width="180" height="32" rx="10" fill="#1c1917" border="1" />
    <circle cx="28" cy="32" r="5" fill="#10b981" />
    <text x="40" y="36" fill="#e7dfd5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ishqyara.social</text>
    
    <!-- 3 Dots (Highlighted) -->
    <rect x="206" y="14" width="32" height="36" rx="8" fill="#9e1b22" fill-opacity="0.3" stroke="#9e1b22" stroke-width="1.5" />
    <circle cx="222" cy="24" r="2.2" fill="#ffffff" />
    <circle cx="222" cy="32" r="2.2" fill="#ffffff" />
    <circle cx="222" cy="40" r="2.2" fill="#ffffff" />

    <!-- Step 1 & 2 Text -->
    <text x="14" y="74" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">STEP 1 &amp; 2</text>
    <text x="14" y="94" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Tap Chrome Menu (⋮)</text>
    <text x="14" y="108" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11">Select &quot;Install app&quot;</text>
  </g>

  <!-- STEP 2: Install Dialog Prompt -->
  <g transform="translate(310, 30)">
    <rect width="260" height="150" rx="18" fill="#1c1917" stroke="#9e1b22" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Dialog Header -->
    <rect x="16" y="16" width="40" height="40" rx="10" fill="url(#brandGrad)" />
    <text x="36" y="41" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">IY</text>
    
    <text x="66" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Install IshqYara?</text>
    <text x="66" y="48" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="10.5">ishqyara.social</text>

    <!-- Dialog Buttons -->
    <rect x="156" y="102" width="88" height="32" rx="10" fill="url(#brandGrad)" />
    <text x="200" y="122" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Install</text>

    <text x="114" y="122" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cancel</text>

    <!-- Step Label -->
    <rect x="16" y="70" width="228" height="22" rx="6" fill="#292524" />
    <text x="24" y="85" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STEP 3: Tap &quot;Install&quot; to confirm</text>
  </g>

  <!-- STEP 3: Home Screen Result -->
  <g transform="translate(30, 175)">
    <rect width="540" height="135" rx="18" fill="#292524" stroke="#44403c" stroke-width="1.2" />
    
    <!-- Home Screen Mockup Item -->
    <g transform="translate(30, 22)">
      <rect width="64" height="64" rx="16" fill="url(#brandGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" filter="url(#shadow)" />
      <!-- Heart motif -->
      <path d="M32 46 C20 36 18 28 24 23 C28 19 32 23 32 23 C32 23 36 19 40 23 C46 28 44 36 32 46 Z" fill="#ffffff" />
      <text x="32" y="98" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">IshqYara</text>
    </g>

    <!-- Right Summary Description -->
    <g transform="translate(130, 28)">
      <rect x="0" y="0" width="105" height="20" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="52" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">READY TO USE</text>
      
      <text x="0" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">STEP 4 &amp; 5: Open directly from your Home Screen</text>
      <text x="0" y="66" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="12">IshqYara runs like a native app with full screen view and fast access.</text>
      <text x="0" y="85" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11">No App Store or Play Store downloads needed!</text>
    </g>
  </g>
</svg>
