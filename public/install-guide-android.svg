<svg width="680" height="380" viewBox="0 0 680 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e1b22" />
      <stop offset="100%" stop-color="#c22830" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e1b22" />
      <stop offset="100%" stop-color="#83161c" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="680" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Platform Badge Header -->
  <rect x="24" y="18" width="130" height="28" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" />
  <text x="36" y="37" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🤖 Android Chrome</text>

  <text x="168" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Tap Menu &gt; Install App &gt; Confirm</text>

  <!-- SCREEN 1: Chrome Browser & 3-Dot Menu -->
  <g transform="translate(24, 60)" filter="url(#shadow)">
    <!-- Phone frame top -->
    <rect width="290" height="294" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Chrome Address Bar -->
    <rect x="12" y="12" width="226" height="36" rx="18" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <!-- Lock icon -->
    <path d="M26 29v-3a3 3 0 0 1 6 0v3m-7 0h8a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z" stroke="#64748b" stroke-width="1.5" fill="none" />
    <text x="39" y="35" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ishqyara.com</text>

    <!-- Chrome 3-Dots Button (Highlighted with Red Circle) -->
    <rect x="248" y="10" width="30" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="263" cy="22" r="2.2" fill="#9e1b22" />
    <circle cx="263" cy="30" r="2.2" fill="#9e1b22" />
    <circle cx="263" cy="38" r="2.2" fill="#9e1b22" />

    <!-- Step 1 Callout Badge -->
    <rect x="238" y="55" width="46" height="18" rx="5" fill="#9e1b22" />
    <text x="261" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Step 1</text>

    <!-- Chrome Dropdown Menu -->
    <g transform="translate(90, 80)" filter="url(#shadow)">
      <rect width="190" height="194" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      
      <!-- Menu item: New tab -->
      <text x="16" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">New tab</text>
      <line x1="12" y1="38" x2="178" y2="38" stroke="#f1f5f9" stroke-width="1" />

      <!-- Menu item: Bookmarks -->
      <text x="16" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Bookmarks</text>
      <line x1="12" y1="70" x2="178" y2="70" stroke="#f1f5f9" stroke-width="1" />

      <!-- Menu item: Share -->
      <text x="16" y="90" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Share...</text>
      <line x1="12" y1="102" x2="178" y2="102" stroke="#f1f5f9" stroke-width="1" />

      <!-- HIGHLIGHTED MENU ITEM: Install App -->
      <rect x="6" y="108" width="178" height="42" rx="8" fill="#fef2f2" stroke="#9e1b22" stroke-width="2" />
      <!-- Download/install icon -->
      <path d="M22 124v6m0 0l-3-3m3 3l3-3m-6 9h12" stroke="#9e1b22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="133" fill="#9e1b22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Install app</text>
      <!-- Step 2 badge -->
      <rect x="126" y="120" width="50" height="18" rx="4" fill="#9e1b22" />
      <text x="151" y="133" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Step 2</text>

      <!-- Menu item: Settings -->
      <text x="16" y="174" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Settings</text>
    </g>
  </g>

  <!-- SCREEN 2: Install Confirmation & Result -->
  <g transform="translate(340, 60)" filter="url(#shadow)">
    <rect width="316" height="294" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Confirmation Dialog -->
    <rect x="18" y="18" width="280" height="145" rx="14" fill="#ffffff" stroke="#9e1b22" stroke-width="1.5" />
    
    <text x="32" y="44" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Install app?</text>

    <!-- App Info Preview in Dialog -->
    <g transform="translate(32, 58)">
      <!-- App Icon -->
      <rect width="38" height="38" rx="10" fill="url(#brandGrad)" />
      <path d="M19 14.5c-2.5-3-6.5-1.5-6.5 1.5 0 3 6.5 8 6.5 8s6.5-5 6.5-8c0-3-4-4.5-6.5-1.5z" fill="#ffffff" />
      <text x="48" y="18" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">IshqYara</text>
      <text x="48" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ishqyara.com</text>
    </g>

    <!-- Dialog Buttons -->
    <rect x="130" y="116" width="70" height="32" rx="8" fill="#f1f5f9" />
    <text x="165" y="136" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cancel</text>

    <!-- Install Button (Highlighted) -->
    <rect x="210" y="116" width="78" height="32" rx="8" fill="url(#brandGrad)" />
    <text x="249" y="136" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Install</text>

    <!-- Step 3 Callout Badge -->
    <rect x="214" y="92" width="68" height="18" rx="4" fill="#9e1b22" />
    <text x="248" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Step 3: Tap</text>

    <!-- Step 4 & 5: Home Screen Result Banner -->
    <g transform="translate(18, 178)">
      <rect width="280" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="14" y="22" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ STEP 4 &amp; 5: INSTALLED ON HOME SCREEN</text>
      
      <!-- Home Screen Apps Row Mockup -->
      <g transform="translate(24, 32)">
        <!-- Generic App 1 -->
        <rect x="0" y="0" width="38" height="38" rx="10" fill="#e2e8f0" />
        <!-- Generic App 2 -->
        <rect x="52" y="0" width="38" height="38" rx="10" fill="#e2e8f0" />
        
        <!-- IshqYara App (Active & Glowing) -->
        <rect x="110" y="-4" width="46" height="46" rx="13" fill="url(#brandGrad)" stroke="#ef4444" stroke-width="2" />
        <path d="M133 13c-3-3.5-7.5-1.5-7.5 2 0 3.5 7.5 9 7.5 9s7.5-5.5 7.5-9c0-3.5-4.5-5.5-7.5-2z" fill="#ffffff" />
        <text x="133" y="56" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">IshqYara</text>
        <circle cx="152" cy="0" r="7" fill="#10b981" />
        <path d="M149 0l2 2 4-4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Generic App 3 -->
        <rect x="180" y="0" width="38" height="38" rx="10" fill="#e2e8f0" />
      </g>
    </g>
  </g>
</svg>
