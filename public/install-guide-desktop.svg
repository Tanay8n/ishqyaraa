<svg width="680" height="380" viewBox="0 0 680 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e1b22" />
      <stop offset="100%" stop-color="#c22830" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="680" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Platform Badge Header -->
  <rect x="24" y="18" width="168" height="28" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" />
  <text x="36" y="37" fill="#6d28d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">💻 Desktop (Chrome &amp; Edge)</text>

  <text x="206" y="37" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Address Bar Install Icon &gt; Click Install &gt; Enjoy Desktop App</text>

  <!-- SCREEN 1: Desktop Browser Top Window Mockup -->
  <g transform="translate(24, 60)" filter="url(#shadow)">
    <rect width="632" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Browser Window Titlebar with Tabs -->
    <rect width="632" height="36" rx="14" fill="#f1f5f9" />
    <!-- Window controls (red, yellow, green dots) -->
    <circle cx="20" cy="18" r="5" fill="#f87171" />
    <circle cx="36" cy="18" r="5" fill="#fbbf24" />
    <circle cx="52" cy="18" r="5" fill="#34d399" />

    <!-- Active Browser Tab -->
    <rect x="74" y="6" width="170" height="30" rx="8" fill="#ffffff" />
    <circle cx="88" cy="21" r="5" fill="#9e1b22" />
    <text x="100" y="25" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">IshqYara — Web App</text>

    <!-- Address Bar (Omnibox) -->
    <g transform="translate(16, 48)">
      <rect width="600" height="42" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      
      <!-- Back, forward, reload -->
      <path d="M20 21l5-5m-5 5l5 5M40 21l-5-5m5 5l-5 5" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="60" cy="21" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" />

      <!-- URL Input Field (Step 1) -->
      <rect x="78" y="6" width="370" height="30" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <path d="M92 23v-3a3 3 0 0 1 6 0v3m-7 0h8a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z" stroke="#10b981" stroke-width="1.5" fill="none" />
      <text x="108" y="25" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">https://ishqyara.social</text>

      <!-- HIGHLIGHTED ADDRESS BAR INSTALL ICON (Step 2) -->
      <rect x="460" y="4" width="130" height="34" rx="8" fill="#fef2f2" stroke="#9e1b22" stroke-width="2" />
      <!-- Install Icon: Monitor with down arrow inside screen -->
      <rect x="468" y="10" width="18" height="13" rx="2" stroke="#9e1b22" stroke-width="1.8" fill="none" />
      <path d="M477 13v4m0 0l-2-2m2 2l2-2m-4 7h6" stroke="#9e1b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="492" y="25" fill="#9e1b22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Install App</text>

      <!-- Step 2 Badge Callout -->
      <rect x="480" y="48" width="94" height="20" rx="5" fill="#9e1b22" />
      <text x="527" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Step 2: Click icon</text>
    </g>

    <text x="24" y="128" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">
      Tip: If you don&apos;t see the icon in the URL bar, click the browser three-dot menu (⋮) &gt; &quot;Install IshqYara&quot;
    </text>
  </g>

  <!-- SCREEN 2: Desktop Prompt & Standalone Window Result -->
  <g transform="translate(24, 224)" filter="url(#shadow)">
    <!-- Confirmation Dialog (Left Box) -->
    <g transform="translate(0, 0)">
      <rect width="320" height="130" rx="14" fill="#ffffff" stroke="#9e1b22" stroke-width="1.5" />
      
      <text x="18" y="28" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Install app?</text>
      
      <g transform="translate(18, 40)">
        <rect width="36" height="36" rx="9" fill="url(#brandGrad)" />
        <path d="M18 13.5c-2.4-3-6-1.5-6 1.5 0 3 6 7.5 6 7.5s6-4.5 6-7.5c0-3-3.6-4.5-6-1.5z" fill="#ffffff" />
        <text x="46" y="17" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">IshqYara</text>
        <text x="46" y="31" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ishqyara.social</text>
      </g>

      <rect x="156" y="86" width="70" height="30" rx="7" fill="#f1f5f9" />
      <text x="191" y="105" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cancel</text>

      <!-- Install Button Highlighted (Step 3) -->
      <rect x="234" y="86" width="74" height="30" rx="7" fill="url(#brandGrad)" />
      <text x="271" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Install</text>

      <rect x="236" y="64" width="70" height="18" rx="4" fill="#9e1b22" />
      <text x="271" y="77" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">Step 3: Click</text>
    </g>

    <!-- Standalone Desktop Window Result (Right Box) -->
    <g transform="translate(336, 0)">
      <rect width="296" height="130" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      
      <!-- Window Title Bar -->
      <rect width="296" height="28" rx="14" fill="#9e1b22" />
      <text x="16" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">IshqYara (Standalone Window)</text>
      <circle cx="276" cy="14" r="4" fill="#ffffff" fill-opacity="0.8" />
      <circle cx="262" cy="14" r="4" fill="#ffffff" fill-opacity="0.8" />

      <!-- Step 4 Success Note -->
      <g transform="translate(16, 42)">
        <text x="0" y="14" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ STEP 4: LAUNCH FROM DESKTOP</text>
        <text x="0" y="32" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          IshqYara now runs as a dedicated desktop app
        </text>
        <text x="0" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">
          Accessible from Desktop shortcut, Taskbar, or Start menu.
        </text>

        <!-- Small desktop icon preview -->
        <g transform="translate(0, 54)">
          <rect width="24" height="24" rx="6" fill="url(#brandGrad)" />
          <path d="M12 9c-1.5-2-4-1-4 1 0 2 4 5 4 5s4-3 4-5c0-2-2.5-3-4-1z" fill="#ffffff" />
          <text x="32" y="16" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">IshqYara Desktop Shortcut</text>
        </g>
      </g>
    </g>
  </g>
</svg>
